$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - crs
  - category
  - imputation
additionalProperties: false

$defs:
  excluded_ids:
    type: array
    items:
      type: string
    uniqueItems: true

  non_empty_string:
    type: string
    minLength: 1

  positive_number:
    type: number
    exclusiveMinimum: 0

  year_map:
    type: object
    propertyNames:
      $ref: "#/$defs/non_empty_string"
    additionalProperties:
      type: integer
      minimum: 1

  technology_mapping_base:
    title: Technology Mapping
    description: >
      Allows users to re-map technology names to their desired naming convention.
      These names will be reflected in the resulting files, and will also be used during validation.

properties:
  crs:
    description: Coordinate reference system settings in the form 'epsg:xxxx'.
    type: object
    properties:
      projected:
        description: CRS to use during operations related to distance / area.
        type: string
        pattern: '^(epsg|EPSG):\d{4,5}$'
    required:
      - projected
    additionalProperties: false # Ensures no extra properties in "crs"

  category:
    title: Category
    description: Powerplant category settings, subdivided into bins based on EIA statistics.
    type: object
    additionalProperties: false
    properties:
      bioenergy:
        title: Bioenergy and Waste powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum: [unknown]
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 1
                maxProperties: 1
        required:
          - technology_mapping

      fossil:
        title: Fossil powerplant settings, subdivided into Coal and Oil and Gas projects.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                additionalProperties: false
                properties:
                  coal:
                    allOf:
                      - $ref: "#/$defs/technology_mapping_base"
                      - type: object
                        propertyNames:
                          enum:
                            - CFB
                            - IGCC
                            - subcritical
                            - supercritical
                            - ultra-supercritical
                            - unknown
                        additionalProperties:
                          $ref: "#/$defs/non_empty_string"
                        minProperties: 6
                        maxProperties: 6
                  oil_gas:
                    allOf:
                      - $ref: "#/$defs/technology_mapping_base"
                      - type: object
                        propertyNames:
                          enum:
                            - AFC
                            - ICCC
                            - IGCC
                            - ISCC
                            - "combined cycle"
                            - "gas turbine"
                            - "internal combustion"
                            - "steam turbine"
                            - unknown
                        additionalProperties:
                          $ref: "#/$defs/non_empty_string"
                        minProperties: 9
                        maxProperties: 9
                required:
                  - coal
                  - oil_gas
        required:
          - technology_mapping

      geothermal:
        title: Geothermal powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum:
                    - "advanced geothermal systems (AGS)"
                    - "binary cycle"
                    - "dry steam"
                    - "enhanced geothermal systems (EGS)"
                    - "flash steam - double"
                    - "flash steam - single"
                    - "flash steam - triple"
                    - "flash steam - unknown"
                    - "geopressured geothermal system (GGS)"
                    - unknown
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 10
                maxProperties: 10
        required:
          - technology_mapping

      hydropower:
        title: Hydropower powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum:
                    - Canal
                    - PS
                    - ROR
                    - STO
                    - unknown
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 5
                maxProperties: 5
        required:
          - technology_mapping

      nuclear:
        title: Nuclear powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum:
                    - "advanced boiling water reactor"
                    - "boiling water reactor"
                    - "fast breeder reactor"
                    - "fast neutron reactor"
                    - "gas-cooled reactor"
                    - "heavy water gas-cooled reactor"
                    - "heavy water light water reactor"
                    - "high temperature gas reactor"
                    - "light water graphite reactor"
                    - "liquid-metal-cooled fast reactor"
                    - "microreactor"
                    - "molten salt reactor"
                    - "pressurized heavy water reactor"
                    - "pressurized water reactor"
                    - "small modular reactor"
                    - "steam-generating heavy water reactor"
                    - "unknown"
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 17
                maxProperties: 17
        required:
          - technology_mapping

      solar:
        title: Solar powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum: [csp, rooftop_pv, utility_pv]
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 3
                maxProperties: 3
          dc_ac_ratio:
            title: DC to AC convertion ratio.
            description: |
              Used to convert MWdc to MWac to ensure all PV projects use a consistent capacity unit.
              Genarally, 1.25 is recommended. See https://doi.org/10.1016/j.apenergy.2016.05.134
            type: object
            additionalProperties: false
            properties:
              utility_pv:
                $ref: "#/$defs/positive_number"
            required:
              - utility_pv
        required:
          - technology_mapping
          - dc_ac_ratio

      wind:
        title: Wind powerplant settings.
        type: object
        additionalProperties: false
        properties:
          excluded_ids:
            $ref: "#/$defs/excluded_ids"
          source:
            title: Data source
            description: |
              This module accepts two possible datasources for wind powerplants:

                - gem: download and use the Global Energy Monitor's Global Wind Power Tracker dataset (free, open license).
                - wemi: use a user provided .xls from the Wind Energy Market Intelligence dataset (paid, closed license).
            type: string
            enum:
              - wemi
              - gem
          technology_mapping:
            allOf:
              - $ref: "#/$defs/technology_mapping_base"
              - type: object
                propertyNames:
                  enum: [offshore, onshore]
                additionalProperties:
                  $ref: "#/$defs/non_empty_string"
                minProperties: 2
                maxProperties: 2
        required:
          - source
          - technology_mapping

  fuel_mapping:
    title: Fuel Mapping
    description: |
      We provide a standardised naming convention for combustion fuels (see `workflow/internal/settings.yaml`).
      In some cases, users might want to simplify these names or disaggregate them further.
      This optional configuration allows to do just that on a per-fuel basis.
    type: object
    propertyNames:
      enum:
        - "bioenergy: agricultural waste (biogas)"
        - "bioenergy: agricultural waste (solids)"
        - "bioenergy: agricultural waste (syngas)"
        - "bioenergy: agricultural waste (unknown)"
        - "bioenergy: biodiesel"
        - "bioenergy: bio-heavy oil"
        - "bioenergy: ethanol"
        - "bioenergy: paper mill wastes"
        - "bioenergy: refuse (landfill gas)"
        - "bioenergy: refuse (municipal and industrial wastes)"
        - "bioenergy: refuse (syngas)"
        - "bioenergy: unknown"
        - "bioenergy: wastewater and sewage sludge (solids or biogas)"
        - "bioenergy: wood & other biomass (biocoal)"
        - "bioenergy: wood & other biomass (solids)"
        - "bioenergy: wood & other biomass (syngas)"
        - "coal: anthracite"
        - "coal: bituminous"
        - "coal: lignite"
        - "coal: subbituminous"
        - "coal: unknown"
        - "coal: waste coal"
        - "fossil gas: coalbed methane"
        - "fossil gas: gaseous propane"
        - "fossil gas: LNG"
        - "fossil gas: natural gas"
        - "fossil gas: unknown"
        - "fossil gas: waste heat from natural gas"
        - "fossil liquids: crude oil"
        - "fossil liquids: diesel"
        - "fossil liquids: fuel oil"
        - "fossil liquids: gasoline"
        - "fossil liquids: heavy fuel oil"
        - "fossil liquids: jet fuel"
        - "fossil liquids: kerosene"
        - "fossil liquids: light fuel oil"
        - "fossil liquids: liquefied petroleum gas"
        - "fossil liquids: naphtha"
        - "fossil liquids: petroleum coke"
        - "fossil liquids: unknown"
        - "fossil liquids: waste/other oil"
        - "industrial by-product:"
        - "industrial by-product: blast furnace gas"
        - "industrial by-product: coke oven gas"
        - "industrial by-product: unknown"
        - "other: hydrogen (blue)"
        - "other: hydrogen (green)"
        - "other: hydrogen (gray)"
        - "other: hydrogen (unknown)"
        - "other: tires"
    additionalProperties:
      $ref: "#/$defs/non_empty_string"

  imputation:
    title: Imputation
    description: >
      Settings used for imputation / guess work. Mostly related to technology lifetimes.
      These will be mostly applied during 'imputation' rules before results are generated.
    type: object
    additionalProperties: false
    required:
      - location
      - time
    properties:
      location:
        title: Location imputation
        description: Settings in this section affect how the module modifies the location of powerplants.
        type: object
        additionalProperties: false
        required:
          - remove_shape_overlaps
          - inner_distance
          - on_overlap
          - on_shape_class_error
        properties:
          remove_shape_overlaps:
            title: Remove shape overlaps
            description: |
              If enabled, run algorithms to remove overlaps between user provided shapes.
              WARNING: slows down processing significantly. Avoid if possible!
            type: boolean
          inner_distance:
            title: Inner distance
            description: |
              Distance, in projected CRS units, used when relocating powerplant points into valid placement areas.
              Applies both to overlap-split plants and to plants forced into a target shape class.
              The point is placed approximately this far inside the selected polygon from the nearest boundary/contact point.
              If the available interior segment is shorter, the midpoint of that segment is used.
            $ref: "#/$defs/positive_number"
          on_overlap:
            title: Overlap adjustment method
            description: |
              Controls how to handle powerplants that overlap on more than one shape.
               - "raise" stops the workflow with an error listing the overlapping powerplants.
               - "split_capacity" creates smaller duplicate powerplants in each intersecting shape, moved using `inner_distance`.
            type: string
            enum:
              - raise
              - split_capacity
          on_shape_class_error:
            title: Forced shape class adjustment error handling
            description: |
              Controls how to handle powerplants whose technology is configured for a forced `shape_class`, but no matching shape exists in that plant's country.
              - "raise": Stop the workflow with an error listing the failing country/shape_class/technology combinations.
              - "ignore": Leave those powerplants unchanged.
              - "drop": Remove those powerplants.
            type: string
            enum:
              - raise
              - ignore
              - drop
          shape_class:
            title: Forced `shape_class` adjustment.
            description: |
              Optional. Maps powerplant technologies to a `shape_class`.
              Powerplants with a listed technology are moved to the nearest matching shape class within their assigned country.
              Allowed values are "land" and "maritime".
            type: object
            additionalProperties:
              type: string
              enum:
                - land
                - maritime
      time:
        title: Time imputation
        description: Settings in this section relate to temporal aspects of powerplants
        additionalProperties: false
        required:
          - scenario
          - lifetime_years
          - retirement_delay_years
        properties:
          scenario:
            title: Scenario
            description: |
              Determines which 'future' facilities to keep beyond the adjustment year. In order of lower to higher uncertainty:
                - historical: only keep existing capacities.
                - construction: keeps the above plus projects already in construction (RECOMMENDED).
                - pre_construction: keeps the above plus projects in pre-construction stages (e.g., those processing permits).
                - announced: keeps the above plus announced projects that have not reached permitting stages. Highly speculative.
            type: string
            enum:
              - historical
              - construction
              - pre_construction
              - announced
          lifetime_years:
            $ref: "#/$defs/year_map"
          retirement_delay_years:
            $ref: "#/$defs/year_map"
          start_year_imputation_method:
            title: Start year imputation method
            description: |
              Method used to impute missing start years after direct backfilling
              from known end years. 'group_average' preserves the previous
              behaviour by assigning rounded group-average start years.
              'capacity_profile' assigns missing start years deterministically
              using capacity-weighted commissioning profiles from comparable
              assets.
            type: string
            enum:
              - group_average
              - capacity_profile
            default: group_average
